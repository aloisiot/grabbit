[package]
name = "grabbit"
version = "0.2.0"
description = "Open-source desktop front-end for yt-dlp"
authors = ["Grabbit contributors"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grabbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time", "fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
futures-util = "0.3.34"
sha2 = "0.11.1"
hex = "0.4.3"
uuid = { version = "1.29.3", features = ["v4"] }
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.191"
